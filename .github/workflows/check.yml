name: Check

# Проверки для веток. Push в main проверяет Deploy перед выкладкой, поэтому main здесь пропущен.
# PR из ветки этого репозитория показывает статус этих же прогонов, отдельный pull_request не нужен.
on:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test
        run: npm run check
